<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Introuvable | Team Vyzium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050608;
            --accent-color: #3bcf17;
            --accent-glow: rgba(59, 207, 23, 0.25);
            --text-main: #f5f6fa;
            --text-muted: #8a96a3;
            --border-color: rgba(59, 207, 23, 0.15);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        header {
            padding: 15px 8%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 6, 8, 0.8);
            backdrop-filter: blur(15px);
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(8rem, 20vw, 12rem);
            font-weight: 700;
            line-height: 1;
            color: var(--accent-color);
            text-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        p {
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            font-size: 1rem;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 4px 20px rgba(59, 207, 23, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(59, 207, 23, 0.5);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <div class="logo-container">
            <a href="/">
                <img src="asset/logo.png" alt="Team Vyzium Logo" class="logo-img">
            </a>
        </div>
    </header>

    <main>
        <div class="error-code">404</div>
        <h1>Page Introuvable</h1>
        <p>Le sous-domaine ou la page que vous recherchez n'existe pas ou a été déplacé. Notre vision reste claire, même si ce chemin ne l'est pas.</p>
        <a href="/" class="btn">Retour à l'accueil</a>
    </main>

</body>
</html>
