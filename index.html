<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyzium | V2 en préparation</title>
    <meta name="description" content="Vyzium travaille actuellement sur la V2. Reviens le 30 août à 15h !">
    <meta property="og:title" content="Vyzium | V2 en préparation">
    <meta property="og:description" content="Vyzium travaille actuellement sur la V2. Reviens le 30 août à 15h !">
    <meta property="og:url" content="https://vyzium.xyz">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#ff0000">
    <link rel="icon" href="logo.gif" type="image/gif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #120404;
            --accent-color: #ff1a1a;
            --accent-glow: rgba(255, 26, 26, 0.25);
            --text-main: #f5f6fa;
            --text-muted: #c9a0a0;
            --border-color: rgba(255, 26, 26, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(-45deg, #120404, #2b0606, #1a0202, #3a0a0a, #120404);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(255, 26, 26, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 26, 26, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,0.8) 0%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.8) 0%, transparent 80%);
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(90px);
            pointer-events: none;
            animation: drift 14s ease-in-out infinite;
        }

        .ambient-glow.one { top: -20%; left: -15%; }
        .ambient-glow.two { bottom: -25%; right: -15%; animation-delay: 4s; }
        .ambient-glow.three { top: 15%; left: 70%; width: 450px; height: 450px; animation-delay: 8s; }
        .ambient-glow.four { bottom: 10%; left: 15%; width: 400px; height: 400px; animation-delay: 6s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.55; }
            33% { transform: translate(60px, -40px) scale(1.1); opacity: 0.9; }
            66% { transform: translate(-40px, 50px) scale(0.95); opacity: 0.7; }
        }

        .particle {
            position: fixed;
            bottom: -20px;
            z-index: -1;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 26, 26, 0.5);
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.6);
            pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(40px); opacity: 0; }
        }

        .container {
            text-align: center;
            padding: 60px 8%;
        }

        .logo {
            width: 220px;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 0 60px var(--accent-glow);
            margin-bottom: 40px;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            letter-spacing: -2px;
            margin-bottom: 15px;
            animation: fadeUp 1s ease both;
        }

        h1 span {
            background: linear-gradient(90deg, #ff1a1a, #ff6b6b, #ff1a1a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradientText 4s linear infinite;
        }

        @keyframes gradientText {
            to { background-position: 200% center; }
        }

        .sub {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            animation: fadeUp 1s 0.15s ease both;
        }

        .sub strong {
            color: var(--accent-color);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 26, 26, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 30px;
            min-width: 130px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            animation: fadeUp 1s ease both;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 26, 26, 0.18) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.9s ease;
            pointer-events: none;
        }

        .time-box:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 26, 26, 0.6);
            box-shadow: 0 15px 40px var(--accent-glow);
        }

        .time-box:hover::before {
            transform: translateX(100%);
        }

        .time-box .num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--accent-glow);
            line-height: 1;
        }

        .time-box .label {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .logo { width: 160px; }
            .countdown { gap: 12px; }
            .time-box { min-width: 90px; padding: 18px 15px; }
            .time-box .num { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="ambient-glow one"></div>
    <div class="ambient-glow two"></div>
    <div class="ambient-glow three"></div>
    <div class="ambient-glow four"></div>
    <div class="particle" style="left: 10%; animation-duration: 12s; animation-delay: 0s;"></div>
    <div class="particle" style="left: 25%; animation-duration: 16s; animation-delay: 3s;"></div>
    <div class="particle" style="left: 40%; animation-duration: 11s; animation-delay: 1s;"></div>
    <div class="particle" style="left: 55%; animation-duration: 18s; animation-delay: 5s;"></div>
    <div class="particle" style="left: 68%; animation-duration: 13s; animation-delay: 2s;"></div>
    <div class="particle" style="left: 80%; animation-duration: 15s; animation-delay: 7s;"></div>
    <div class="particle" style="left: 92%; animation-duration: 12s; animation-delay: 4s;"></div>

    <div class="container">
        <img src="logo.gif" alt="Vyzium Logo" class="logo">
        <h1>Vyzium <span>V2</span></h1>
        <p class="sub"><strong>Coming soon</strong> &middot; Le 30 août à 15h</p>

        <div class="countdown">
            <div class="time-box" style="animation-delay: 0.35s;">
                <div class="num" id="weeks">--</div>
                <div class="label">Semaines</div>
            </div>
            <div class="time-box" style="animation-delay: 0.45s;">
                <div class="num" id="days">--</div>
                <div class="label">Jours</div>
            </div>
            <div class="time-box" style="animation-delay: 0.55s;">
                <div class="num" id="hours">--</div>
                <div class="label">Heures</div>
            </div>
            <div class="time-box" style="animation-delay: 0.65s;">
                <div class="num" id="minutes">--</div>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box" style="animation-delay: 0.75s;">
                <div class="num" id="seconds">--</div>
                <div class="label">Secondes</div>
            </div>
        </div>

        <div class="footer">
            &copy; Vyzium &middot; <a href="mailto:contact@vyzium.xyz">contact@vyzium.xyz</a>
        </div>
    </div>

    <script>
        const target = new Date(2026, 7, 30, 15, 0, 0);

        const weeksEl = document.getElementById('weeks');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function update() {
            const diff = target - new Date();

            if (diff <= 0) {
                weeksEl.textContent = '00';
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalDays = Math.floor(totalHours / 24);

            weeksEl.textContent = pad(Math.floor(totalDays / 7));
            daysEl.textContent = pad(totalDays % 7);
            hoursEl.textContent = pad(totalHours % 24);
            minutesEl.textContent = pad(totalMinutes % 60);
            secondsEl.textContent = pad(totalSeconds % 60);
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
